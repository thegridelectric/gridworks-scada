[project]
name = "gridworks-scada"
version = "0.0.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "setuptools",
    "numpy>=2.3.3",
    "pydantic>=2.11.9",
    "pydantic-settings>=2.11.0",
    "python-dotenv>=1.1.1",
    "paho-mqtt",
    "pytz",
    "xdg",
    "result",
    "transitions",
    "gridworks-protocol>=1.3.3",
    "gridworks-proactor",
    "gridworks-scada-protocol",
    "smbus2",
    "pymodbus",
    "pyserial",
    "pyModbusTCP",
    # ltn
    "httpx",
    # CLI tooling
    # Intended behavior: invoking `gws` with no arguments should display the help
    # screen and exit with code 0.
    #
    # Typer >=0.24 / Click >=8.3 changed group invocation semantics so that
    # invoking a command group with no subcommand exits with code 2 (usage error).
    # That breaks test_cli expectations and changes CLI behavior.
    #
    # Pin Typer/Click below those versions until CLI behavior is intentionally
    # updated and tests adjusted accordingly.
    "rich>=14.1.0",
    "typer>=0.17.4,<0.24",
    "click<8.3",
    "trogon",
    "textual>=6.1.0",
    "textual-dev",
]

[dependency-groups]
# Raspberry Pi only.
drivers = [
    "board",
    "adafruit-circuitpython-ads1x15",
    "adafruit-circuitpython-pcf8575",
]
dev = [
    "gridworks-admin",
    "pytest",
    "coverage",
    "mypy>=1.15.0",
    "ruff>=0.9.6",
    "black",
    "pytest-asyncio",
    "pyyaml",  # the sema conformance checker reads the snapshot indexes
    "isort",
    "gridworks-cert>=0.4.4",
    "gridworks-proactor[tests]",
    "requests",  # for ltn dashboard
    "memray",
    # temporary until FLO is decoupled
    "pandas>=2.3.3",
    "openpyxl>=3.1.5",
    "matplotlib>=3.10.7",
    "pika>=1.3.2",
]

[tool.uv]
package = false
# The deployed scadas are Raspberry Pis running 64-bit Raspberry Pi OS.
required-environments = [
    "sys_platform == 'linux' and platform_machine == 'aarch64'",
]

[tool.uv.sources]
gridworks-proactor = { git = "https://github.com/thegridelectric/gridworks-proactor.git", tag = "v4.1.13+jm3" }
gridworks-scada-protocol = { path = "packages/gridworks-scada-protocol", editable = true }
gridworks-admin = { path = "packages/gridworks-admin", editable = true }

[tool.pytest.ini_options]
pythonpath = ["gw_spaceheat"]
log_format = "%(asctime)s %(message)s"
addopts = """\
--show-capture=no \
"""

[tool.ruff]
exclude = [
    ".github",
    "CodeGenerationTools",
    "for_docker",
    ".git",
    ".mypy_cache",
    ".nox",
    "htmlcov",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".venv",
    "pythonProject",
    ".idea",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "docs",
]
output-format = "concise"
fix = false
show-fixes = true

[tool.ruff.lint]
# default select used by  ruff: ["E4", "E7", "E9", "F"]
ignore = [
    "ANN101", # Deprecated
    "ANN102", # Deprecated
    "ANN401", # When we use 'Any' we mean it.
    "B027",
    "COM812",
    "CPY",
    "D",
    "DOC",
    "E252", # Formatter
    "E302",
    "E501",
    "EM",
    "FA", # We only support Python >= 3.10, so we shouldn't need this
    "ISC001",
    "N801",
    "N803", # Protocol sometimes calls for CamelCase arguments.
    "N818", # We disagree with Pep8 about naming exceptions.
    "PGH004", # ruff and IDE can disagree, in which case a simple # noqa might be need.
    "PLW1514",
    "TRY003", # Many of our ValueErrors contain messages that are not plausibly resuable.
    "RUF100", # ruff and IDE often disagree about whether a 'noqa' is in use.
    "W191",
    "W291", # Formatter
    "W293", # Formatter
]

[tool.ruff.lint.extend-per-file-ignores]
"tests/**/*.py" = [
    "ARG001", # Unused function args -> fixtures nevertheless are functionally relevant...
    "C901", # Complexity
    "FBT", # Don't care about booleans as positional arguments in tests, e.g. via @pytest.mark.parametrize()
    "G004", # Ok to use f-strings in logging in test code
    "N806", # We want to be able to have non pep8 variable names.
    "PLR0912", # Complexity
    "PLR0913", # Complexity
    "PLR0915", # Complexity
    "PT011", # It's not practical to match strings in exceptions caught by pytest.raises()
    "S101", # asserts allowed in tests...
]
"src/gwproactor_test/**/*.py" = [
    "ARG001",
    "C901", # Complexity
    "FBT",
    "G004",
    "N806", # We want to be able to have non pep8 variable names.
    "PLR0912",
    "PLR0913",
    "PLR0915",
    "PT011",
    "S101",
]
