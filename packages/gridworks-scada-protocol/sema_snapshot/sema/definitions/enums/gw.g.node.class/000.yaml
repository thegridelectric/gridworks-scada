$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://schemas.electricity.works/enums/gw.g.node.class/000"

title: "gw.g.node.class"
type: "string"
description: >
  GridWorks functional classification for Grid Nodes (GNodes).
  Defines the operational or service-level role a GNode performs
  within the GridWorks ecosystem.

  This enum is specific to GridWorks. Other organizations MAY define
  their own functional taxonomies under separate namespaces (e.g.,
  acme.g.node.class). Structural interoperability across organizations
  is governed by base.g.node.class, not by this enum.

enum:
  - "Unknown"
  - "TerminalAsset"
  - "ConnectivityNode"
  - "LeafTransactiveNode"
  - "MarketMaker"
  - "Scada"
  - "PriceForecastService"
  - "WeatherForecastService"

default: "Unknown"

x-gridworks:
  owner: "gridworks-energy"
  version: "000"
  value_descriptions:
    "Unknown": "A GNode whose class has not yet been assigned."
    "TerminalAsset": >
      A physical transactive asset such as a heat pump, hot water heater, residential battery, 
      electric vehicle, or any other end-use device located behind an atomic metered point.

    "ConnectivityNode": >
      A physical topological node in the electric power system where conductors join,
      split, or change configuration. Conceptually aligned with the ConnectivityNode
      in the IEC 61970/61968 CIM (Common Information Model), but simplified for
      distribution-level modeling and OPF applications.

    "LeafTransactiveNode": >
      The atomic metered unit of the grid. Represents the smallest indivisible metering
      boundary capable of participating in markets or entering Dispatch Contracts on
      behalf of a TerminalAsset. Every TerminalAsset is associated with exactly one
      LeafTransactiveNode.

    "MarketMaker": >
      A physical constraint point in the conductor topology that requires localized market
      coordination. Identified as a grid location (e.g., feeder constraint, transformer limit)
      where a MarketMaker actor computes local prices for balancing and constraint compliance.
      See [market-maker](https://gridworks.readthedocs.io/en/latest/market-maker.html).

    "Scada": >
      A GNode responsible for local telemetry, data acquisition, and control of a TerminalAsset.

    "PriceForecastService": >
      A service that provides forward price projections for planning,
      bidding, or dispatch optimization.

    "WeatherForecastService": >
      A service that provides meteorological forecasts used for load and generation prediction.
