$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://schemas.electricity.works/formats/hh.mm"

title: "hh.mm"
description: >
  Wall-clock time of day at minute resolution, in 24-hour "HH:MM" form with
  both fields zero-padded ("00:00" through "23:59"). Timezone-free: the
  local clock of the consuming context gives it meaning.

type: string
pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"

examples:
  - "00:00"
  - "07:00"
  - "16:30"
  - "23:59"

counterexamples:
  - "24:00"
  - "7:00"
  - "07:60"
  - "0700"
  - "07:00:00"

x-gridworks:
  owner: "gridworks-energy"
