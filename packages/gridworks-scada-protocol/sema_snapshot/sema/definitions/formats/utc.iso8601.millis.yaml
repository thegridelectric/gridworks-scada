$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://schemas.electricity.works/formats/utc.iso8601.millis"

title: "utc.iso8601.millis"
description: >
  UTC timestamp in ISO 8601 format with exactly three digits of fractional
  seconds (millisecond precision) and a 'Z' suffix.

type: string
pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}\\.[0-9]{3}Z$"

examples:
  - "2025-02-26T00:00:00.000Z"
  - "2025-02-26T00:01:23.456Z"

counterexamples:
  - "2025-02-26T00:00:00Z"
  - "2025-02-26T00:00:00.00Z"
  - "2025-02-26T00:00:00.1234Z"
  - "2025-02-26T00:00:00.123+00:00"

x-gridworks:
  owner: "gridworks-energy"