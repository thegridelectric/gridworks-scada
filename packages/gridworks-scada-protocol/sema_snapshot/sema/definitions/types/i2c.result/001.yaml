$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://schemas.electricity.works/types/i2c.result/001"

title: "i2c.result"
type: object
description: >
  The result of an I²C bus operation, correlated to its request by TriggerId.

properties:

  Bus:
    $ref: "https://schemas.electricity.works/formats/spaceheat.name"
    description: >
      The name of the I²C bus actor that ran the operation.

  Operation:
    $ref: "https://schemas.electricity.works/enums/i2c.operation/001"
    description: >
      The kind of operation this result reports.

  Value:
    $ref: "https://schemas.electricity.works/formats/non.negative.int"
    description: >
      The value read (a bit 0/1 for a bit read, a 1- or 2-byte register value
      for a register read); absent for a write, a multi-byte read, or a
      failed operation.

  Bytes:
    type: array
    items:
      $ref: "https://schemas.electricity.works/formats/non.negative.int"
    description: >
      The bytes received, in wire order, for a ReadBytes operation; absent
      otherwise.

  Success:
    type: boolean
    description: >
      True if the operation completed without error.

  Error:
    type: string
    description: >
      The error detail when Success is false.

  UnixTimeMs:
    $ref: "https://schemas.electricity.works/formats/utc.milliseconds"
    description: >
      When the operation completed.

  TriggerId:
    $ref: "https://schemas.electricity.works/formats/uuid4.str"
    description: >
      Correlates this result with its request.

  TypeName:
    const: "i2c.result"

  Version:
    const: "001"

required:
  - Bus
  - Operation
  - Success
  - UnixTimeMs
  - TriggerId
  - TypeName
  - Version

additionalProperties: false

examples:
  - |
    {
      "Bus": "scada",
      "Operation": "ReadReg",
      "Value": 7,
      "Success": true,
      "UnixTimeMs": 1700000000000,
      "TriggerId": "6f74e8b9-4fc9-4b95-bd6f-2c150662b40e",
      "TypeName": "i2c.result",
      "Version": "001"
    }
  - |
    {
      "Bus": "scada",
      "Operation": "ReadBytes",
      "Bytes": [64, 128, 0],
      "Success": true,
      "UnixTimeMs": 1700000000000,
      "TriggerId": "0d3a5c2e-9a41-4a67-8f2e-5b1c9e7d4a10",
      "TypeName": "i2c.result",
      "Version": "001"
    }

x-gridworks:
  owner: "gridworks-energy"
  axioms:
    - number: 1
      name: "ErrorIffFailure"
      statement: >
        Error SHALL be present and non-blank if and only if Success is false.
  extended_description: >
    Bus is the SpaceheatName of the I2cBus actor node that ran the operation
    within a GridWorks SCADA ShNode hierarchy. It corresponds to a bus declared
    in the board's gw1.scada.device.type.gt BusList; the actor-name to
    hardware-bus-name bijection is a hardware-layout concern.
