$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://schemas.electricity.works/types/pico.btu.meter.component.gt/000"

title: "pico.btu.meter.component.gt"
type: object
description: >
  A Pico BTU-meter component (one installed device instance): a flow meter plus hot
  and cold thermistors (and optionally a CT voltage reading) that a Pico samples to
  compute thermal power. Flat — the shared component fields are spelled out here.

properties:

  ComponentId:
    $ref: "https://schemas.electricity.works/formats/uuid4.str"

  DeviceType:
    $ref: "https://schemas.electricity.works/formats/pascal.case"
    description: >
      The device category this component is built on, an open
      pascal-case string.


  SerialNumber:
    type: string

  FlowChannelName:
    $ref: "https://schemas.electricity.works/formats/spaceheat.name"

  HotChannelName:
    $ref: "https://schemas.electricity.works/formats/spaceheat.name"

  ColdChannelName:
    $ref: "https://schemas.electricity.works/formats/spaceheat.name"

  CtChannelName:
    $ref: "https://schemas.electricity.works/formats/spaceheat.name"
    description: >
      Channel name for the CT voltage reading, when ReadCtVoltage is true.

  ReadCtVoltage:
    type: boolean

  SendHz:
    type: boolean

  FlowMeterType:
    $ref: "https://schemas.electricity.works/formats/pascal.case"
    description: >
      The flow meter, as an open `pascal.case` device-type string (a `gw1.device.type`
      value, e.g. `SaierFlowSensor` / `GridworksPicoFlowHall` / `GridworksPicoFlowReed`).

  HzCalcMethod:
    $ref: "https://schemas.electricity.works/enums/hz.calc.method/001"

  TempCalcMethod:
    $ref: "https://schemas.electricity.works/enums/temp.calc.method/000"

  GpmFromHzMethod:
    $ref: "https://schemas.electricity.works/enums/gpm.from.hz.method/000"

  ThermistorBeta:
    type: integer

  GallonsPerPulse:
    $ref: "https://schemas.electricity.works/formats/positive.float"

  AsyncCaptureDeltaGpmX100:
    type: integer

  AsyncCaptureDeltaCelsiusX100:
    type: integer

  AsyncCaptureDeltaCtVoltsX100:
    type: integer
    description: >
      Async-capture threshold for the CT voltage channel; present when
      ReadCtVoltage is true.

  DisplayName:
    type: string

  HwUid:
    type: string

  PicoBoardVariant:
    $ref: "https://schemas.electricity.works/enums/pico.board.variant/000"
    description: >
      The physical board this pico was provisioned on.

  MicropythonVersion:
    type: string
    description: >
      The MicroPython release this pico was provisioned with, as
      `os.uname().release` reports it.

  FirmwareCommit:
    $ref: "https://schemas.electricity.works/formats/firmware.commit"
    description: >
      The gridworks-pico commit this pico was provisioned from.

  TypeName:
    const: "pico.btu.meter.component.gt"

  Version:
    const: "000"

required:
  - ComponentId
  - DeviceType
  - SerialNumber
  - FlowChannelName
  - HotChannelName
  - ColdChannelName
  - ReadCtVoltage
  - SendHz
  - FlowMeterType
  - HzCalcMethod
  - TempCalcMethod
  - GpmFromHzMethod
  - ThermistorBeta
  - GallonsPerPulse
  - AsyncCaptureDeltaGpmX100
  - AsyncCaptureDeltaCelsiusX100
  - PicoBoardVariant
  - TypeName
  - Version

additionalProperties: false

examples:
  - |
    {
      "ComponentId": "7fc24a16-37e6-442b-83cb-9b5be5a3cce9",
      "DeviceType": "Gw101",
      "SerialNumber": "example",
      "FlowChannelName": "scada",
      "HotChannelName": "scada",
      "ColdChannelName": "scada",
      "ReadCtVoltage": false,
      "SendHz": false,
      "FlowMeterType": "MakeModel",
      "HzCalcMethod": "BasicExpWeightedAvg",
      "TempCalcMethod": "SimpleBeta",
      "GpmFromHzMethod": "Constant",
      "ThermistorBeta": 0,
      "GallonsPerPulse": 1,
      "AsyncCaptureDeltaGpmX100": 0,
      "AsyncCaptureDeltaCelsiusX100": 0,
      "PicoBoardVariant": "PicoRaspberryWifi2040",
      "TypeName": "pico.btu.meter.component.gt",
      "Version": "000"
    }
x-gridworks:
  owner: "gridworks-energy"

  axioms:
    - number: 1
      name: "ReadCtVoltageIffCtVoltsDelta"
      statement: >
        ReadCtVoltage SHALL be true iff AsyncCaptureDeltaCtVoltsX100 is present.
    - number: 2
      name: "ReadCtVoltageIffCtChannelName"
      statement: >
        ReadCtVoltage SHALL be true iff CtChannelName is present.

  extended_description: >
    `DeviceType` and `FlowMeterType` are open `pascal.case` strings. The device-type
    enum (the device-category vocabulary) whose membership they must satisfy is
    articulated by any hardware layout for which this type is a sub-type — the layout
    enforces it, so this component type stays version-stable as device types are added.
    DeviceType values come from the `gw1.device.type` vocabulary; the hardware layout
    enforces membership.

    The `.gt` suffix declares that this type is coupled bijectively with a table in
    a canonical seed database (here, the terminalasset registry): the table's rows are
    instances of this type. Sema is the authority over what a row means; the seed
    table is the authority over which instances are currently asserted.
