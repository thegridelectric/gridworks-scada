x-gridworks:
  owner: "gridworks-energy"

  axioms:
    - number: 1
      name: "CreatedWithinTenSeconds"
      statement: >
        If Status is Created, MessageCreatedMs / 1000 SHALL be no more
        than 10 seconds after Contract.StartS.

    - number: 2
      name: "StatusAuthority"
      statement: >
        a. If Status is Created, Confirmed or TerminatedByLtn, FromNode
           SHALL be ltn and IsAuthoritative SHALL be true.
        b. If Status is Received or TerminatedByScada, FromNode SHALL be
           s and IsAuthoritative SHALL be true.
        c. If Status is CompletedSuccess, CompletedFailureByLtn or
           CompletedFailureByScada, IsAuthoritative SHALL be false.

    - number: 3
      name: "CausePresence"
      statement: >
        Cause SHALL be present if and only if Status is TerminatedByLtn,
        TerminatedByScada, CompletedUnknownOutcome, CompletedFailureByLtn
        or CompletedFailureByScada.

    - number: 4
      name: "FromNodeIsParty"
      statement: >
        FromNode SHALL be s or ltn.

    - number: 5
      name: "ScadaReportsWattHours"
      statement: >
        WattHoursUsed SHALL be present if and only if FromNode is s.

    - number: 6
      name: "ReasonOnScadaTermination"
      statement: >
        Reason SHALL be present if and only if Status is
        TerminatedByScada.
