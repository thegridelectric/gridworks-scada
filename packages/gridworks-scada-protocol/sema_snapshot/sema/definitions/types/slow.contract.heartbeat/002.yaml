$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://schemas.electricity.works/types/slow.contract.heartbeat/002"

title: "slow.contract.heartbeat"
type: object
description: >
  One party's statement about a slow dispatch contract: the contract, its
  status as that party sees it, and the chained digits and proof that tie
  the statement to the counterparty's last one. The LTN and the scada
  exchange these from offer to completion.

properties:
  FromNode:
    $ref: "https://schemas.electricity.works/formats/spaceheat.name"
    description: >
      The party speaking: ltn for the LTN, s for the scada.

  Contract:
    $ref: "https://schemas.electricity.works/types/slow.dispatch.contract/000"
    description: >
      The contract this heartbeat is about.

  PreviousStatus:
    $ref: "https://schemas.electricity.works/enums/gw1.slow.dispatch.contract.status/000"
    description: >
      The status the sender last stated, when this heartbeat changes it.

  Status:
    $ref: "https://schemas.electricity.works/enums/gw1.slow.dispatch.contract.status/000"
    description: >
      The contract's status as the sender states it.

  MessageCreatedMs:
    $ref: "https://schemas.electricity.works/formats/utc.milliseconds"
    description: >
      When the sender created this heartbeat.

  Cause:
    type: string
    description: >
      Free text on why the contract ended or failed.

  Reason:
    $ref: "https://schemas.electricity.works/enums/gw.dispatch.refusal.reason/000"
    description: >
      Why the scada ends the contract, in the scada's one vocabulary for
      declining or ending dispatch. Beside the free-text Cause.

  IsAuthoritative:
    type: boolean
    description: >
      Whether the sender has authority over the status it states, rather
      than stating a claim for an umpire to settle.

  WattHoursUsed:
    type: integer
    description: >
      The electrical energy the house has used under the contract so far,
      as the scada measures it.

  MyDigit:
    $ref: "https://schemas.electricity.works/formats/decimal.digit"
    description: >
      A digit the sender chooses for this heartbeat; the counterparty
      echoes it as YourLastDigit, chaining the exchange.

  YourLastDigit:
    $ref: "https://schemas.electricity.works/formats/decimal.digit"
    description: >
      The MyDigit of the counterparty's last heartbeat about this contract.

  SignedProof:
    type: string
    description: >
      The sender's signature over the heartbeat and the counterparty's
      last proof. A placeholder until signing is live.

  TypeName:
    const: "slow.contract.heartbeat"

  Version:
    const: "002"

required:
  - FromNode
  - Contract
  - Status
  - MessageCreatedMs
  - IsAuthoritative
  - MyDigit
  - SignedProof
  - TypeName
  - Version

additionalProperties: false

examples:
