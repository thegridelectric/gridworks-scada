        "DurationMinutes": 60,
        "AvgPowerWatts": 3500,
        "OilBoilerOn": false,
        "ContractId": "9d3b2a1c-8e7f-4a6b-b5c4-d3e2f1a0b9c8",
        "TypeName": "slow.dispatch.contract",
        "Version": "000"
      },
      "Status": "Created",
      "MessageCreatedMs": 1757300402150,
      "IsAuthoritative": true,
      "MyDigit": 3,
      "SignedProof": "signed_proof_stub",
      "TypeName": "slow.contract.heartbeat",
      "Version": "002"
    }
  - |
    {
      "FromNode": "s",
      "Contract": {
        "ScadaAlias": "hw1.isone.me.versant.keene.beech.scada",
        "StartS": 1757300400,
        "DurationMinutes": 60,
        "AvgPowerWatts": 3500,
        "OilBoilerOn": false,
        "ContractId": "9d3b2a1c-8e7f-4a6b-b5c4-d3e2f1a0b9c8",
        "TypeName": "slow.dispatch.contract",
        "Version": "000"
      },
      "PreviousStatus": "Created",
      "Status": "Received",
      "MessageCreatedMs": 1757300403400,
      "IsAuthoritative": true,
      "WattHoursUsed": 0,
      "MyDigit": 8,
      "YourLastDigit": 3,
