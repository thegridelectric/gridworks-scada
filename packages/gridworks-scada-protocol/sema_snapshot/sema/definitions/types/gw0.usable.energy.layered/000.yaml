$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://schemas.electricity.works/types/gw0.usable.energy.layered/000"

title: "gw0.usable.energy.layered"
type: object
description: >
  Names the layered-storage model for computing usable thermal energy. The
  word carries no parameters: it is an identifier for a named computation,
  carried where a consumer must state which model produced a value rather
  than agreeing on one out of band.

properties:

  TypeName:
    const: "gw0.usable.energy.layered"

  Version:
    const: "000"

required:
  - TypeName
  - Version

additionalProperties: false

examples:
  - |
    {
      "TypeName": "gw0.usable.energy.layered",
      "Version": "000"
    }

x-gridworks:
  owner: "gridworks-energy"
  extended_description: >
    Usable thermal energy is the energy currently in storage that can still
    be delivered to the house. This model computes it by treating storage as
    discrete layers discharged in sequence, each layer usable only down to
    the return-water temperature the heating forecast requires at that
    moment.

    The model assumes ideal stratification within each layer and no thermal
    losses. Which tanks count as active storage is a runtime decision of the
    consumer, not part of this specification — the same model applies
    whether the buffer alone or every tank is in play.
