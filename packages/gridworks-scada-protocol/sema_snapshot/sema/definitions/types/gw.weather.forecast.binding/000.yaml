$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://schemas.electricity.works/types/gw.weather.forecast.binding/000"

title: "gw.weather.forecast.binding"
type: object
description: >
  One forecast channel together with the observed channel it targets,
  as a gw.weather.forecast.bundle.gt embeds it. Embedding the pair
  makes the target binding checkable from the instance alone and
  hands a consumer the quantity, unit and location of each series
  the bundle serves in one fetch. Not a record of its own: the
  bundle's membership in the weather DB, read with its channels.

properties:
  ForecastChannel:
    $ref: "https://schemas.electricity.works/types/gw.weather.forecast.channel.gt/000"
    description: >
      The forecast channel serving one series of the bundle.

  ObservationChannel:
    $ref: "https://schemas.electricity.works/types/gw.weather.channel.gt/002"
    description: >
      The observed channel ForecastChannel targets — the series its
      skill is scored against.

  TypeName:
    const: "gw.weather.forecast.binding"

  Version:
    const: "000"

required:
  - ForecastChannel
  - ObservationChannel
  - TypeName
  - Version

additionalProperties: false

