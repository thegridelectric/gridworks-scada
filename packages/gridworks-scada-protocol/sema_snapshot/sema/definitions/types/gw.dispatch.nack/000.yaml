$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://schemas.electricity.works/types/gw.dispatch.nack/000"

title: "gw.dispatch.nack"
type: object
description: >
  A scada node's reply that a command was refused, with the reason. Sent
  by the target node direct to whoever sent the command, boss or not;
  taken or refused is discriminated by the reply's TypeName (the success
  twin is gw.dispatch.ack), never by inspecting a field. This is the
  reply an operator most needs: a command that was dropped for being
  busy, from the wrong boss, or out of vocabulary used to produce nothing
  the sender could see.

properties:

  FromHandle:
    $ref: "https://schemas.electricity.works/formats/handle.name"
    description: >
      The node that refused the command.

  ToHandle:
    $ref: "https://schemas.electricity.works/formats/handle.name"
    description: >
      The refused command's FromHandle: the sender, whether or not it is
      the node's boss in the live command tree.

  TriggerId:
    $ref: "https://schemas.electricity.works/formats/uuid4.str"
    description: >
      The command's TriggerId, so a boss with several commands in flight
      knows which one was answered.

  Reason:
    $ref: "https://schemas.electricity.works/enums/gw.scada.cmd.refusal.reason/000"

  UnixTimeMs:
    $ref: "https://schemas.electricity.works/formats/utc.milliseconds"

  TypeName:
    const: "gw.dispatch.nack"

  Version:
    const: "000"

required:
  - FromHandle
  - ToHandle
  - TriggerId
  - Reason
  - UnixTimeMs
  - TypeName
  - Version

additionalProperties: false

examples:
  - |
    {
      "FromHandle": "admin.pico-cycler",
      "ToHandle": "admin",
      "TriggerId": "1c0d8f5e-3f4a-4b3c-9d2e-7a6b5c4d3e2f",
      "Reason": "Busy",
      "UnixTimeMs": 1757282100250,
      "TypeName": "gw.dispatch.nack",
      "Version": "000"
    }

x-gridworks:
  owner: "gridworks-energy"
