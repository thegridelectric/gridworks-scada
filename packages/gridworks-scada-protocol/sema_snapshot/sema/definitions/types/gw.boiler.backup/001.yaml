$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://schemas.electricity.works/types/gw.boiler.backup/001"

title: "gw.boiler.backup"
type: object
description: >
  A boiler that heats the house as backup to the heat pump, fired by an
  aquastat. The fuel does not change the control: the scada holds the
  boiler off through an intercept relay, and where the plant has a
  failsafe relay the local control hands the heat pump to the aquastat
  through it.

properties:
  FailsafeRelayName:
    $ref: "https://schemas.electricity.works/formats/spaceheat.name"
    description: >
      The relay that gives control of the heat pump to the scada when
      energized and to the aquastat when de-energized. Absent where the
      heat pump has no aquastat to fall back to.

  InterceptRelayName:
    $ref: "https://schemas.electricity.works/formats/spaceheat.name"
    description: >
      The relay in the aquastat's signal to the boiler. De-energized it
      passes the signal and the aquastat fires the boiler; energized it
      gives the signal to the scada, which can hold the boiler off.

  InService:
    type: boolean
    description: >
      Whether the boiler can be run as backup. False for a boiler that is
      installed and not wired to its relays, or out of service.

  TypeName:
    const: "gw.boiler.backup"

  Version:
    const: "001"

required:
  - InterceptRelayName
  - InService
  - TypeName
  - Version

additionalProperties: false

examples:
  - |
    {
      "FailsafeRelayName": "hp-failsafe-relay",
      "InterceptRelayName": "aquastat-ctrl-relay",
      "InService": true,
      "TypeName": "gw.boiler.backup",
      "Version": "001"
    }

x-gridworks:
  owner: "gridworks-energy"
  axioms:
    - number: 1
      name: "DistinctRelays"
      statement: >
        Where FailsafeRelayName is present, it SHALL NOT equal
        InterceptRelayName.
