$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://schemas.electricity.works/types/i2c.thermistor.reader.component.gt/000"

title: "i2c.thermistor.reader.component.gt"
type: object
description: >
  Configuration for an I2C thermistor reader component that samples one board-resident
  ADC and publishes one or more thermistor-backed temperature channels. Board-generic:
  the ADC is identified by `AdcName`, resolved against the ThermistorAdcs of the
  board record reached via BoardComponentId (the scada board component, whose
  DeviceType names the board's board device-type record carrying the
  physical facts: bus, address, reference volts, series resistance). The
  component carries only identity, channel configs, and the temperature calculation
  method. Flat — the shared component fields are spelled out here.

properties:
  ComponentId:
    $ref: "https://schemas.electricity.works/formats/uuid4.str"

  BoardComponentId:
    $ref: "https://schemas.electricity.works/formats/uuid4.str"
    description: >
      The component id of the scada board this device is resident on.

  ConfigList:
    type: array
    items:
      $ref: "https://schemas.electricity.works/types/i2c.thermistor.channel.config/000"
    description: >
      Thermistor channel configurations attached to this ADC reader.

  DisplayName:
    type: string

  HwUid:
    type: string

  AdcName:
    $ref: "https://schemas.electricity.works/formats/pascal.case"
    description: >
      The name of the board ADC this reader samples, intended to be uniquely
      identifiable on the board.

  DataRateSps:
    $ref: "https://schemas.electricity.works/formats/positive.int"
    description: >
      The single-shot conversion data rate, in samples per second, the
      reader writes in the ADC's config word on every conversion.

  TempCalcMethod:
    $ref: "https://schemas.electricity.works/enums/temp.calc.method/000"

  TypeName:
    const: "i2c.thermistor.reader.component.gt"

  Version:
    const: "000"

required:
  - ComponentId
  - BoardComponentId
  - ConfigList
  - AdcName
  - DataRateSps
  - TempCalcMethod
  - TypeName
  - Version

additionalProperties: false

examples:
  - |
    {
      "ComponentId": "8879f861-add7-4b45-a200-1c2e29c49fdf",
      "BoardComponentId": "9b1c5e2a-77d4-4f6e-8c3a-5f2e9d101b44",
      "ConfigList": [
        {
          "ChannelName": "scada",
          "AdcChannel": "P0",
          "ThermistorBeta": 1,
          "TypeName": "i2c.thermistor.channel.config",
          "Version": "000"
        }
      ],
      "AdcName": "Thermistors",
      "DataRateSps": 16,
      "TempCalcMethod": "SimpleBeta",
      "TypeName": "i2c.thermistor.reader.component.gt",
      "Version": "000"
    }
x-gridworks:
  owner: "gridworks-energy"
  axioms:
    - number: 1
      name: "ChannelNameUniqueness"
      statement: >
        Channel names SHALL be unique across the ConfigList.
  extended_description: >
    The `.gt` suffix declares that this type is coupled bijectively with a table in
    a canonical seed database (here, the terminalasset registry): the table's rows are
    instances of this type. Sema is the authority over what a row means; the seed
    table is the authority over which instances are currently asserted.

    The board's physical facts live on its `gw1.scada.device.type.gt` record.
