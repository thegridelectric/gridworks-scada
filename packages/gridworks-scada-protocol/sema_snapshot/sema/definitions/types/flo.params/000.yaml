    {
      "GNodeAlias": "hw1.isone.me.versant.keene.oak",
      "CreatedMs": 1762008900000,
      "StartUnixS": 1762009200,
      "StepDurationMinutes": [60, 60, 60],
      "LmpUsdMwhList": [28.14, 28.53, 46.38],
      "DistUsdMwhList": [50.13, 50.13, 487.63],
      "OatFList": [30.0, 29.0, 28.5],
      "LoadKwhList": [3.5, 3.6, 3.8],
      "RswtFList": [120.0, 121.0, 122.5],
      "WeatherForecastId": "5f1c2b3a-8d4e-4f60-9a7b-1c2d3e4f5a6b",
      "SeasonalStorageMode": "BufferOnly",
      "TanksModeled": 1,
      "GallonsPerTank": 120,
      "TempSensorsPerTank": 3,
      "MaxTankTempF": 170,
      "InitialTopTempF": 120.0,
      "InitialMiddleTempF": 110.0,
      "InitialBottomTempF": 100.0,
      "InitialThermocline1": 1,
      "InitialThermocline2": 2,
      "HpCurrentlyOn": false,
      "HpMaxKwEl": 9.66,
      "HpTurnOnMinutes": 12,
      "CopIntercept": 1.5,
      "CopOatCoeff": 0.015,
      "CopLwtCoeff": 0,
      "CopMin": 1.5,
      "CopMinOatF": 0,
      "PriceMaxUsdMwh": 2000,
      "PriceMinUsdMwh": -100,
      "Tuning": {
        "StorageLossesPercent": 0.5,
        "HpMinKwEl": 0,
        "HpMaxKwTh": 25,
        "MaxLoadKwTh": 20,
        "HpConstantLiftF": 20,
        "LoadBucketUpperKwhList": [],
        "RwtInterceptByBucketList": [49.463],
        "RwtSlopeByBucketList": [0.427],
        "RwtMinF": 50,
        "RswtPenaltyEnabled": true,
        "RswtPenaltyWeight": 0.02,
        "RswtPenaltyDecay": 0.9,
        "RswtPenaltyExponentRate": 0.15,
        "RswtPenaltyDecayMaxHour": 12,
        "ShortCyclePenaltyEnabled": true,
        "ShortCyclePenaltyWeight": 6.0,
        "StabilityPenaltyEnabled": true,
        "StabilityPenaltyWeight": 0.5,
        "StabilityPenaltyDecay": 0.75,
        "StabilityPenaltyThresholdKwh": 10.0,
        "StabilityPenaltyThresholdPriceMwh": 15.0,
        "StabilityPenaltyHorizonHours": 20,
        "TerminalCostEnabled": true,
        "TerminalCostEndWindowHours": 24,
        "TypeName": "flo.tuning.bruce",
        "Version": "000"
      },
      "TypeName": "flo.params",
      "Version": "000"
    }

x-gridworks:
  owner: "gridworks-energy"
  axioms:
    - number: 1
      name: "StepListLengths"
      statement: >
        StepDurationMinutes, LmpUsdMwhList, DistUsdMwhList, OatFList,
        LoadKwhList and RswtFList SHALL be non-empty and of the same length.
    - number: 2
      name: "ThermoclinesWithinTheStore"
      statement: >
        InitialThermocline1 SHALL be at most InitialThermocline2, and
        InitialThermocline2 SHALL be at most TempSensorsPerTank times
        TanksModeled.
    - number: 3
      name: "BufferIsOneTank"
      statement: >
        If SeasonalStorageMode is BufferOnly, TanksModeled SHALL be 1.
    - number: 4
      name: "PriceBounds"
      statement: >
        PriceMinUsdMwh SHALL be less than PriceMaxUsdMwh.
    - number: 5
      name: "PreviousRunTogether"
      statement: >
        PreviousOptimalPath and PreviousEstimateElecUsdMwhNow SHALL be
        both present or both absent.
