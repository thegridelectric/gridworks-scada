$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://schemas.electricity.works/types/flo.params/000"

title: "flo.params"
type: object
description: >
  One request to a Forward Looking Optimizer for one market slot: the house
  it bids for, the step grid, the price and weather forecasts, the store
  being modeled and its state at the slot start, the heat pump's facts and
  the market's price bounds, which every optimizer may read, and the
  tuning of the one optimizer this house runs, whose TypeName names it.
  The optimizer answers with a flo.recommendation.

properties:
  GNodeAlias:
    $ref: "https://schemas.electricity.works/formats/left.right.dot"
    description: >
      GNodeAlias of the bidder the request is for.
  CreatedMs:
    $ref: "https://schemas.electricity.works/formats/utc.milliseconds"
    description: >
      The requester's clock when the request came to be.
  StartUnixS:
    $ref: "https://schemas.electricity.works/formats/utc.seconds"
    description: >
      Start of the first step, the market slot start.
  StepDurationMinutes:
    type: array
    items:
      $ref: "https://schemas.electricity.works/formats/positive.int"
    description: >
      Length of each step in minutes; the horizon is this list's length.
  LmpUsdMwhList:
    type: array
    items:
      type: number
    description: >
      Forecast wholesale energy price per step, in USD per MWh.
  DistUsdMwhList:
    type: array
    items:
      type: number
    description: >
      Forecast distribution tariff per step, in USD per MWh.
  OatFList:
    type: array
    items:
      type: number
    description: >
      Forecast outside air temperature per step, in degrees F.
  LoadKwhList:
    type: array
    items:
      type: number
    description: >
      Forecast heating load per step, in kWh.
  RswtFList:
    type: array
    items:
      type: number
    description: >
      Required source water temperature per step, in degrees F: the supply
      temperature that meets that step's load.
  WeatherForecastId:
    $ref: "https://schemas.electricity.works/formats/uuid4.str"
    description: >
      The ForecastUid of the gw.weather.forecast the weather lists were read
      from.
  SeasonalStorageMode:
    $ref: "https://schemas.electricity.works/enums/gw1.seasonal.storage.mode/000"
    description: >
      Which store the plant is running on this slot.
  TanksModeled:
    $ref: "https://schemas.electricity.works/formats/positive.int"
    description: >
      Number of tanks in the store being modeled.
  GallonsPerTank:
    $ref: "https://schemas.electricity.works/formats/positive.int"
    description: >
      Water volume of each modeled tank, in US gallons.
  TempSensorsPerTank:
    $ref: "https://schemas.electricity.works/formats/positive.int"
    description: >
      Temperature sensors on each modeled tank, top to bottom.
  MaxTankTempF:
    type: number
    description: >
      The hottest the store may be charged to, in degrees F.
  InitialTopTempF:
    type: number
  InitialMiddleTempF:
    type: number
  InitialBottomTempF:
    type: number
  InitialThermocline1:
    $ref: "https://schemas.electricity.works/formats/positive.int"
    description: >
      Sensor position, counted from the top across the modeled tanks, where
      the top layer ends.
  InitialThermocline2:
    $ref: "https://schemas.electricity.works/formats/positive.int"
    description: >
      Sensor position, counted from the top across the modeled tanks, where
      the middle layer ends.
  HpCurrentlyOn:
    type: boolean
  HpMaxKwEl:
    type: number
    description: >
      The heat pump's maximum electric draw, in kW.
  HpTurnOnMinutes:
    $ref: "https://schemas.electricity.works/formats/positive.int"
    description: >
      Minutes from a call for heat until the heat pump delivers it.
  CopIntercept:
    type: number
  CopOatCoeff:
    type: number
  CopLwtCoeff:
    type: number
  CopMin:
    type: number
  CopMinOatF:
    type: number
  PriceMaxUsdMwh:
    type: number
    description: >
      The market's price ceiling; the first pair of the bid sits here.
  PriceMinUsdMwh:
    type: number
    description: >
      The market's price floor.
  PreviousOptimalPath:
    $ref: "https://schemas.electricity.works/types/flo.optimal.path/000"
    description: >
      The path the previous slot's recommendation led to at the price that
      cleared, for the plan stability penalty.
  PreviousEstimateElecUsdMwhNow:
    type: number
    description: >
      What the previous request forecast for this slot's electricity price,
      in USD per MWh.
  Tuning:
    oneOf:
      - $ref: "https://schemas.electricity.works/types/flo.tuning.alice/000"
      - $ref: "https://schemas.electricity.works/types/flo.tuning.bruce/000"
    description: >
      The tuning of the optimizer this house runs; its TypeName selects the
      optimizer.
  TypeName:
    const: "flo.params"
  Version:
    const: "000"

required:
  - GNodeAlias
  - CreatedMs
  - StartUnixS
  - StepDurationMinutes
  - LmpUsdMwhList
  - DistUsdMwhList
  - OatFList
  - LoadKwhList
  - RswtFList
  - WeatherForecastId
  - SeasonalStorageMode
  - TanksModeled
  - GallonsPerTank
  - TempSensorsPerTank
  - MaxTankTempF
  - InitialTopTempF
  - InitialMiddleTempF
  - InitialBottomTempF
  - InitialThermocline1
  - InitialThermocline2
  - HpCurrentlyOn
  - HpMaxKwEl
  - HpTurnOnMinutes
  - CopIntercept
  - CopOatCoeff
  - CopLwtCoeff
  - CopMin
  - CopMinOatF
  - PriceMaxUsdMwh
  - PriceMinUsdMwh
  - Tuning
  - TypeName
  - Version

additionalProperties: false

