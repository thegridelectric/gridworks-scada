$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://schemas.electricity.works/types/ha1.params/007"

title: "ha1.params"
type: object
description: >
  Parameter set used by Spaceheat SCADA and LTN runtime logic for the HA1
  heating model.

properties:
  AlphaTimes10:
    type: integer

  BetaTimes100:
    type: integer

  GammaEx6:
    type: integer

  IntermediatePowerKw:
    type: number

  IntermediateRswtF:
    type: integer

  DdPowerKw:
    type: number

  DdRswtF:
    type: integer

  DdDeltaTF:
    type: integer

  HpMaxKwEl:
    type: number

  MaxEwtF:
    type: integer

  LoadOverestimationPercent:
    type: integer

  CopIntercept:
    type: number
    description: >
      The heat pump's COP when leaving water is no warmer than outdoor air.
      The COP model is CopIntercept + CopLwtMinusOatCoeff * max(0, LwtF -
      OatF).

  CopLwtMinusOatCoeff:
    type: number
    description: >
      COP change per degree F that leaving water exceeds outdoor air;
      negative for a real heat pump.

  HpTurnOnMinutes:
    type: integer

  TypeName:
    const: "ha1.params"

  Version:
    const: "007"

required:
  - AlphaTimes10
  - BetaTimes100
  - GammaEx6
  - IntermediatePowerKw
  - IntermediateRswtF
  - DdPowerKw
  - DdRswtF
  - DdDeltaTF
  - HpMaxKwEl
  - MaxEwtF
  - LoadOverestimationPercent
  - CopIntercept
  - CopLwtMinusOatCoeff
  - HpTurnOnMinutes
  - TypeName
  - Version

additionalProperties: false

examples:
  - |
    {
      "AlphaTimes10": 120,
      "BetaTimes100": -22,
      "GammaEx6": 0,
      "IntermediatePowerKw": 1.5,
      "IntermediateRswtF": 100,
      "DdPowerKw": 12,
      "DdRswtF": 160,
      "DdDeltaTF": 20,
      "HpMaxKwEl": 6.0,
      "MaxEwtF": 170,
      "LoadOverestimationPercent": 10,
      "CopIntercept": 2.96,
      "CopLwtMinusOatCoeff": -0.00628,
      "HpTurnOnMinutes": 12,
      "TypeName": "ha1.params",
      "Version": "007"
    }

x-gridworks:
  owner: "gridworks-energy"
  axioms:
    - number: 1
      name: "NonPositiveCopLiftCoefficient"
      statement: >
        CopLwtMinusOatCoeff SHALL be at most zero.
