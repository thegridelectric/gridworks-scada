$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://schemas.electricity.works/types/hubitat.poller.component.gt/000"

title: "hubitat.poller.component.gt"
type: object
description: >
  A Hubitat poller component (one polled Hubitat device instance): the poller settings that
  map a Hubitat device's attributes onto SCADA channels. Flat — the shared component fields
  are spelled out here; Poller references the poller record word by $ref.

properties:

  ComponentId:
    $ref: "https://schemas.electricity.works/formats/uuid4.str"
    description: >
      Globally unique identifier for this installed component instance.

  DeviceType:
    $ref: "https://schemas.electricity.works/formats/pascal.case"
    description: >
      The device category this component is built on, an open
      pascal-case string.

  Poller:
    $ref: "https://schemas.electricity.works/types/hubitat.poller.gt/001"
    description: >
      The poller settings for this Hubitat device.

  DisplayName:
    type: string

  HwUid:
    type: string
    description: >
      Hardware unique id of the installed device, when known.

  TypeName:
    const: "hubitat.poller.component.gt"

  Version:
    const: "000"

required:
  - ComponentId
  - DeviceType
  - Poller
  - TypeName
  - Version

additionalProperties: false

examples:
  - |
    {
      "ComponentId": "e4dc08d9-ac73-4383-8b21-1331267f6c94",
      "DeviceType": "HoneywellT6Thermostat",
      "Poller": {
        "HubitatComponentId": "2f51577c-1c95-4d91-b1aa-ec89d302e821",
        "DeviceId": 1,
        "Attributes": [
          {
            "AttributeName": "example",
            "ChannelName": "scada",
            "NodeName": "scada",
            "TelemetryName": "Unknown",
            "Unit": "Unknown",
            "Exponent": 0,
            "InterpretAsNumber": false,
                        "WebPollEnabled": false,
            "WebListenEnabled": false,
            "ReportMissing": false,
            "ReportParseError": false,
            "TypeName": "maker.api.attribute.gt",
            "Version": "001"
          }
        ],
                "WebListenEnabled": false,
        "PollPeriodSeconds": 0.0,
        "TypeName": "hubitat.poller.gt",
        "Version": "001"
      },
      "TypeName": "hubitat.poller.component.gt",
      "Version": "000"
    }
x-gridworks:
  owner: "gridworks-energy"
  extended_description: >
    The `.gt` suffix declares that this type is coupled bijectively with a table in
    a canonical seed database (here, the terminalasset registry): the table's rows are
    instances of this type. Sema is the authority over what a row means; the seed
    table is the authority over which instances are currently asserted.

    DeviceType values come from the `gw1.device.type` vocabulary; the hardware layout enforces membership.

    The poller record is a `hubitat.poller.gt`.
