$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://schemas.electricity.works/types/i2c.write.bit/000"

title: "i2c.write.bit"
type: object
description: >
  A request to write a single bit to a device register on a named I²C bus.

properties:

  Bus:
    $ref: "https://schemas.electricity.works/formats/spaceheat.name"
    description: >
      The name of the I²C bus actor to route this operation through.

  Address:
    $ref: "https://schemas.electricity.works/types/i2c.bit.address/000"
    description: >
      The bit to write.

  Value:
    $ref: "https://schemas.electricity.works/formats/non.negative.int"
    description: >
      The bit value to write (0 or 1).

  TriggerId:
    $ref: "https://schemas.electricity.works/formats/uuid4.str"
    description: >
      Correlates this request with its i2c.result.

  TypeName:
    const: "i2c.write.bit"

  Version:
    const: "000"

required:
  - Bus
  - Address
  - Value
  - TriggerId
  - TypeName
  - Version

additionalProperties: false

examples:
  - |
    {
      "Bus": "scada",
      "Address": {
        "I2cAddress": 33,
        "RegisterIndex": 2,
        "BitIndex": 1,
        "TypeName": "i2c.bit.address",
        "Version": "000"
      },
      "Value": 1,
      "TriggerId": "6f74e8b9-4fc9-4b95-bd6f-2c150662b40e",
      "TypeName": "i2c.write.bit",
      "Version": "000"
    }

x-gridworks:
  owner: "gridworks-energy"
  axioms:
    - number: 1
      name: "BitValueRange"
      statement: >
        Value SHALL be 0 or 1.
  extended_description: >
    Bus is the SpaceheatName of the I2cBus actor node that owns and serializes
    the targeted physical I²C bus within a GridWorks SCADA ShNode hierarchy. It
    corresponds to a bus declared in the board's gw1.scada.device.type.gt
    BusList; the actor-name to hardware-bus-name bijection is a hardware-layout
    concern.
