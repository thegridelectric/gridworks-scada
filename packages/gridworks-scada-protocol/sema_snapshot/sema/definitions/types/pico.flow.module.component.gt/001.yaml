$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://schemas.electricity.works/types/pico.flow.module.component.gt/001"

title: "pico.flow.module.component.gt"
type: object
description: >
  Configuration for a Pico-based flow module component in a Spaceheat SCADA
  deployment.

  This type includes the common component identity fields inherited from
  ComponentGt together with flow-meter specific capture, conversion, and
  publication parameters.

extended_description: >
  `DeviceType` and `FlowMeterType` are open `pascal.case` strings. The device-type
  enum (the device-category vocabulary) whose membership they must satisfy is articulated by any
  hardware layout for which this type is a sub-type — the layout enforces it, so this
  component type stays version-stable as device types are added.


  The `.gt` suffix declares that this type is coupled bijectively with a table in
  a canonical seed database (here, the terminalasset registry): the table's rows are
  instances of this type. Sema is the authority over what a row means; the seed
  table is the authority over which instances are currently asserted.

properties:
  ComponentId:
    $ref: "https://schemas.electricity.works/formats/uuid4.str"

  DeviceType:
    $ref: "https://schemas.electricity.works/formats/pascal.case"
    description: >
      The device category this component is built on, an open
      pascal-case string.

  DisplayName:
    type: string

  HwUid:
    type: string


  SerialNumber:
    type: string

  FlowNodeName:
    $ref: "https://schemas.electricity.works/formats/spaceheat.name"

  FlowMeterType:
    $ref: "https://schemas.electricity.works/formats/pascal.case"
    description: >
      The configured flow meter, as an open `pascal.case` device-type string (a
      `gw1.device.type` value, e.g. `SaierFlowSensor` / `GridworksPicoFlowHall` /
      `GridworksPicoFlowReed`).

  HzCalcMethod:
    $ref: "https://schemas.electricity.works/enums/hz.calc.method/001"
    description: >
      Method used to compute frequency from captured pulse data.

  GpmFromHzMethod:
    $ref: "https://schemas.electricity.works/enums/gpm.from.hz.method/000"
    description: >
      Method used to convert computed frequency into flow rate.

  ConstantGallonsPerTick:
    type: number

  SendHz:
    type: boolean

  SendGallons:
    type: boolean

  SendTickLists:
    type: boolean

  NoFlowMs:
    type: integer

  AsyncCaptureThresholdGpmTimes100:
    type: integer

  PublishEmptyTicklistAfterS:
    type: integer

  PublishAnyTicklistAfterS:
    type: integer

  PublishTicklistPeriodS:
    type: integer

  PublishTicklistLength:
    type: integer

  ExpAlpha:
    type: number

  CutoffFrequency:
    type: number

  PicoBoardVariant:
    $ref: "https://schemas.electricity.works/enums/pico.board.variant/000"
    description: >
      The physical board this pico was provisioned on.

  MicropythonVersion:
    type: string
    description: >
      The MicroPython release this pico was provisioned with, as
      `os.uname().release` reports it.

  FirmwareCommit:
    $ref: "https://schemas.electricity.works/formats/firmware.commit"
    description: >
      The gridworks-pico commit this pico was provisioned from.

  TypeName:
    const: "pico.flow.module.component.gt"

  Version:
    const: "001"

required:
  - ComponentId
  - DeviceType
  - SerialNumber
  - FlowNodeName
  - FlowMeterType
  - HzCalcMethod
  - GpmFromHzMethod
  - ConstantGallonsPerTick
  - SendHz
  - SendGallons
  - SendTickLists
  - NoFlowMs
  - AsyncCaptureThresholdGpmTimes100
  - PicoBoardVariant
  - TypeName
  - Version

additionalProperties: false

examples:
  - |
    {
      "ComponentId": "3702ecf7-32a5-4582-a073-13b8edc1154f",
      "DeviceType": "GridworksPicoFlowHall",
      "SerialNumber": "example",
      "FlowNodeName": "scada",
      "FlowMeterType": "MakeModel",
      "HzCalcMethod": "BasicExpWeightedAvg",
      "GpmFromHzMethod": "Constant",
      "ConstantGallonsPerTick": 0.0,
      "SendHz": false,
      "SendGallons": false,
      "SendTickLists": false,
      "NoFlowMs": 0,
      "AsyncCaptureThresholdGpmTimes100": 0,
      "PicoBoardVariant": "PicoRaspberryWifi2040",
      "TypeName": "pico.flow.module.component.gt",
      "Version": "001"
    }
x-gridworks:
  owner: "gridworks-energy"

  axioms:
    - number: 1
      name: "HwUidPattern"
      statement: >
        If HwUid is present, it SHALL match the pattern pico_xxxxxx where
        xxxxxx consists of six lowercase hexadecimal characters.

  extended_description: >
    DeviceType values come from the `gw1.device.type` vocabulary; the hardware layout enforces membership.
