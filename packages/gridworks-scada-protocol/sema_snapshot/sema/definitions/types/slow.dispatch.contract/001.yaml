$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://schemas.electricity.works/types/slow.dispatch.contract/001"

title: "slow.dispatch.contract"
type: object
description: >
  A slow dispatch contract between an LTN and a scada: for one window
  starting on a five-minute boundary, the scada holds the house's
  average electrical power to AvgPowerWatts. The body a
  slow.contract.heartbeat refers to.

properties:
  ScadaAlias:
    $ref: "https://schemas.electricity.works/formats/left.right.dot"
    description: >
      GNode alias of the scada the contract binds.

  StartS:
    $ref: "https://schemas.electricity.works/formats/utc.seconds"
    description: >
      When the contract window starts.

  DurationMinutes:
    $ref: "https://schemas.electricity.works/formats/positive.int"
    description: >
      The length of the contract window.

  AvgPowerWatts:
    type: integer
    description: >
      The average electrical power the scada holds over the window.

  ContractId:
    $ref: "https://schemas.electricity.works/formats/uuid4.str"
    description: >
      The identity of the contract, shared by every heartbeat about it.

  DispatchTerms:
    $ref: "https://schemas.electricity.works/formats/left.right.dot"
    description: >
      The name of the dispatch terms constant this contract is an
      instance of: the standing agreement between the parties and the
      rules of the market the contract settles in.

  TypeName:
    const: "slow.dispatch.contract"

  Version:
    const: "001"

required:
  - ScadaAlias
  - StartS
  - DurationMinutes
  - AvgPowerWatts
  - ContractId
  - DispatchTerms
  - TypeName
  - Version

additionalProperties: false

examples:
  - |
    {
      "ScadaAlias": "hw1.isone.me.versant.keene.beech.scada",
      "StartS": 1757300400,
      "DurationMinutes": 60,
      "AvgPowerWatts": 3500,
      "ContractId": "9d3b2a1c-8e7f-4a6b-b5c4-d3e2f1a0b9c8",
      "DispatchTerms": "dispatch.terms.first.isone.hack",
      "TypeName": "slow.dispatch.contract",
      "Version": "001"
    }

x-gridworks:
  owner: "gridworks-energy"

  axioms:
    - number: 1
      name: "StartOnFiveMinutes"
      statement: >
        StartS SHALL be a multiple of 300.
