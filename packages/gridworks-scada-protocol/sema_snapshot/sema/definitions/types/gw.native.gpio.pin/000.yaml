$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://schemas.electricity.works/types/gw.native.gpio.pin/000"

title: "gw.native.gpio.pin"
type: object
description: >
  One named native (on-board) GPIO pin of a GridWorks SCADA board, with its BCM
  pin number.

properties:

  Name:
    $ref: "https://schemas.electricity.works/formats/pascal.case"
    description: >
      The pin's name on the board.

  BcmPin:
    $ref: "https://schemas.electricity.works/formats/non.negative.int"
    description: >
      The Broadcom (BCM) pin number.

  TypeName:
    const: "gw.native.gpio.pin"

  Version:
    const: "000"

required:
  - Name
  - BcmPin
  - TypeName
  - Version

additionalProperties: false

x-gridworks:
  owner: "gridworks-energy"
