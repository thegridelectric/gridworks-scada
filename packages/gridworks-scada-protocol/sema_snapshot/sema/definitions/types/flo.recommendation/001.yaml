$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://schemas.electricity.works/types/flo.recommendation/001"

title: "flo.recommendation"
type: object
description: >
  A Forward Looking Optimizer's answer to one flo.params request: the bid
  curve the bidder submits for the slot starting at the request's
  StartUnixS, and for each price-quantity pair the operating path the
  optimizer expects to follow if that pair's quantity clears. The pairs
  descend from the price ceiling, so pair i holds for prices above pair
  i+1's price up to its own, and the bidder reads the cleared price's pair
  and takes the path at the same index. Quantities are the heat pump's
  electrical draw; the market's slot name and sign convention are the
  bidder's to apply. Two words annotate each path: the store's state
  along it, named for the store model, and the penalties the optimizer
  charged along it, named for the optimizer.

properties:

  BidderAlias:
    $ref: "https://schemas.electricity.works/formats/left.right.dot"
    description: >
      GNodeAlias of the bidder the recommendation is for.

  PqPairs:
    type: array
    items:
      $ref: "https://schemas.electricity.works/types/price.quantity.unitless/001"
    description: >
      The bid curve, in PriceUnit and QuantityUnit, first pair at the
      price ceiling.

  PriceUnit:
    $ref: "https://schemas.electricity.works/enums/market.price.unit/000"

  QuantityUnit:
    $ref: "https://schemas.electricity.works/enums/market.quantity.unit/000"

  OptimalPathList:
    type: array
    items:
      $ref: "https://schemas.electricity.works/types/flo.optimal.path/000"
    description: >
      One path per pair, in the order of PqPairs: the path the optimizer
      expects if that pair's quantity clears.

  StoreStateList:
    type: array
    items:
      oneOf:
        - $ref: "https://schemas.electricity.works/types/flo.tank.store.path/000"
    description: >
      One store-state word per path, in the order of OptimalPathList.

  PathPenaltiesList:
    type: array
    items:
      oneOf:
        - $ref: "https://schemas.electricity.works/types/flo.path.penalties.bruce/000"
    description: >
      One penalties word per path, in the order of OptimalPathList.

  FloName:
    $ref: "https://schemas.electricity.works/formats/left.right.dot"
    description: >
      The optimizer's name, its author's chosen tag.

  FloRepo:
    $ref: "https://schemas.electricity.works/formats/non.empty.string"
    description: >
      Where the optimizer's code lives, as its host names it.

  FloGitCommit:
    $ref: "https://schemas.electricity.works/formats/git.commit"
    description: >
      The commit of the optimizer code that produced this recommendation.

  CreatedMs:
    $ref: "https://schemas.electricity.works/formats/utc.milliseconds"
    description: >
      The optimizer's clock when the recommendation came to be.

  TypeName:
    const: "flo.recommendation"

  Version:
    const: "001"

required:
  - BidderAlias
  - PqPairs
  - PriceUnit
  - QuantityUnit
  - OptimalPathList
  - FloName
  - FloRepo
  - FloGitCommit
  - CreatedMs
  - TypeName
  - Version

additionalProperties: false

