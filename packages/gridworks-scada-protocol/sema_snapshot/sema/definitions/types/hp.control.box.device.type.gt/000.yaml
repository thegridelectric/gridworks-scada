$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://schemas.electricity.works/types/hp.control.box.device.type.gt/000"

title: "hp.control.box.device.type.gt"
type: object
description: >
  The specialized device-type record for a heat pump control box category — the
  monobloc's indoor unit. No compressor; typically the hydraulic package (water pump,
  optional backup heater stages) together with the unit's control electronics, a
  touch-screen controller for local operation, and the communication link to the
  outdoor unit. Keyed by `DeviceType` (a device-category value); a component joins
  this record by the shared `DeviceType` value. Carries the three primary-pump facts
  because the unit owning the pump signal varies by architecture. Flat.

properties:

  DeviceType:
    $ref: "https://schemas.electricity.works/formats/pascal.case"
    description: >
      The device category this component is built on, an open
      pascal-case string.

  DisplayName:
    type: string

  PrimaryPumpFactoryInstalled:
    type: boolean
    description: >
      The primary pump ships inside the unit, as opposed to field-supplied.

  PrimaryPumpOverridable:
    type: boolean
    description: >
      The unit exposes its pump-control signal so an external interrupt can be wired
      (the Samsung/LG two-stage terminal-block pattern). False where the pump is
      sealed in with no signal out (e.g. the Samsung AE055 control box).

  PrimaryPumpAlwaysOn:
    type: boolean
    description: >
      Under the unit's own control the primary pump never stops.

  WaterPumpRatedAmps:
    $ref: "https://schemas.electricity.works/formats/positive.float"

  BackupHeaterKwList:
    type: array
    items:
      $ref: "https://schemas.electricity.works/formats/positive.float"
    description: >
      The backup-heater stage options the box offers, in kW (e.g. [2.0, 4.0]).

  Mca:
    $ref: "https://schemas.electricity.works/formats/positive.float"
    description: >
      Minimum circuit ampacity, from the nameplate.

  Mop:
    $ref: "https://schemas.electricity.works/formats/positive.float"
    description: >
      Maximum overcurrent protection, in amps, from the nameplate.

  ProductInfoUrl:
    type: string
    description: >
      Link to a publicly accessible folder or page holding product information for
      this device category — manuals, nameplate photos, wiring diagrams, and
      controls-integration notes.

  TypeName:
    const: "hp.control.box.device.type.gt"

  Version:
    const: "000"

required:
  - DeviceType
  - PrimaryPumpFactoryInstalled
  - PrimaryPumpOverridable
  - PrimaryPumpAlwaysOn
  - TypeName
  - Version

additionalProperties: false

examples:
  - |
    {
      "TypeName": "hp.control.box.device.type.gt",
      "Version": "000",
      "DeviceType": "SamsungAE055FEYMCG",
      "DisplayName": "Samsung AE055 EHS mono control box",
      "PrimaryPumpFactoryInstalled": true,
      "PrimaryPumpOverridable": false,
      "PrimaryPumpAlwaysOn": false,
      "WaterPumpRatedAmps": 0.9,
      "BackupHeaterKwList": [2.0, 4.0],
      "ProductInfoUrl": "https://drive.google.com/drive/folders/1XV80QPgqpyYvMaoQIR9PpGWmu6dSY9kD"
    }

x-gridworks:
  owner: "gridworks-energy"
  extended_description: >
    The `.gt` suffix declares that this type is coupled bijectively with a table in
    a canonical seed database (here, the terminalasset registry): the table's
    rows are instances of this type. Sema is
    the authority over what a row means; the seed table is the authority over which
    instances are currently asserted.

    DeviceType values come from the `gw1.device.type` vocabulary; the hardware layout enforces membership.
