$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://schemas.electricity.works/types/i2c.relay.component.gt/000"

title: "i2c.relay.component.gt"
type: object
description: >
  A single board-resident I²C-driven relay, as one Spaceheat component. Board-generic: it
  works on any board that exposes I²C relays (e.g. a GW108 or a Krida board), distinguished
  by its DeviceType value (Gw108I2cRelay, …).

  It is thin — it names which relay it is (RelayName, resolved against the board's I2cRelays
  map on the board's device-type record, reached from the node's BoardComponentId) and carries one
  control config for the actor-level control semantics. It does NOT restate the physical
  address (bus, i2c address, register, bit) — that is the board's single source of truth.

properties:
  ComponentId:
    $ref: "https://schemas.electricity.works/formats/uuid4.str"

  BoardComponentId:
    $ref: "https://schemas.electricity.works/formats/uuid4.str"
    description: >
      The component id of the scada board this device is resident on.

  RelayName:
    $ref: "https://schemas.electricity.works/formats/pascal.case"
    description: >
      The board relay this component drives, by name — matches a RelayName in the board's
      I2cRelays list (gw1.scada.device.type.gt), which holds the physical address.

  ConfigList:
    type: array
    items:
      $ref: "https://schemas.electricity.works/types/relay.control.config/000"
    description: >
      The relay's control config. Exactly one entry (see axiom ExactlyOneConfig) — one relay
      per component.

  DisplayName:
    type: string

  HwUid:
    type: string

  TypeName:
    const: "i2c.relay.component.gt"

  Version:
    const: "000"

required:
  - ComponentId
  - BoardComponentId
  - RelayName
  - ConfigList
  - TypeName
  - Version

additionalProperties: false

examples:
  - |
    {
      "ComponentId": "7b5a9e2a-c2ae-43bb-a317-ce3941a6ba60",
      "BoardComponentId": "9b1c5e2a-77d4-4f6e-8c3a-5f2e9d101b44",
      "RelayName": "BufferTop",
      "ConfigList": [
        {
          "ActorName": "relay17",
          "ChannelName": "zone1-down-failsafe-relay17",
          "DeEnergizedState": "RelayClosed",
          "DeEnergizingEvent": "CloseRelay",
          "EnergizedState": "RelayOpen",
          "EnergizingEvent": "OpenRelay",
          "EventType": "change.relay.state",
          "StateType": "relay.closed.or.open",
          "TypeName": "relay.control.config",
          "Version": "000",
          "WiringConfig": "NormallyClosed"
        }
      ],
      "TypeName": "i2c.relay.component.gt",
      "Version": "000"
    }

x-gridworks:
  owner: "gridworks-energy"

  axioms:
    - number: 1
      name: "ExactlyOneConfig"
      statement: >
        ConfigList SHALL contain exactly one relay.control.config (one relay per component).

  extended_description: >
    i2c.relay.component.gt is the per-relay device layer of the board-resident I²C model
    (bus / board / device). The I2cBus actor owns bus traffic; the board
    (gw1.scada.device.type.gt) is the single source of physical truth (its I2cRelays map holds
    each relay's bus, i2c address, register, and bit, keyed by RelayName); this component is
    the thin per-relay device carried by at most one ShNode via ComponentId. It replaces the
    legacy multiplexer model (i2c.multichannel.dt.relay.component.gt + positional relay
    indices) with one relay per component, identified by name against the board.

    The `.gt` suffix declares that this type is coupled bijectively with a table in
    a canonical seed database (here, the terminalasset registry): the table's rows are
    instances of this type. Sema is the authority over what a row means; the seed
    table is the authority over which instances are currently asserted.

    The control-config entries are `relay.control.config` records.
