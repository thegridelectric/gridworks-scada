$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://schemas.electricity.works/types/i2c.expander/000"

title: "i2c.expander"
type: object
description: >
  One I²C GPIO expander on a GridWorks SCADA board: its 1-based index within
  the board, the board bus it is attached to, its chip model, and its addressing — either a
  fixed I²C address (soldered) or the list of addresses it can be set to in
  the field (DIP switches), with the chosen address recorded on the deployed
  component.

properties:

  ExpanderIdx:
    $ref: "https://schemas.electricity.works/formats/positive.int"
    description: >
      The 1-based index of this expander within the board.

  I2cBus:
    $ref: "https://schemas.electricity.works/formats/pascal.case"
    description: >
      The name of the board bus this expander is attached to.
  ExpanderType:
    $ref: "https://schemas.electricity.works/enums/i2c.expander.type/000"
    description: >
      The expander chip model, which fixes how the bus is driven to move a
      relay's bit.

  I2cAddress:
    $ref: "https://schemas.electricity.works/formats/non.negative.int"
    description: >
      The fixed I²C bus address of the expander, when the address is set at
      manufacture (soldered).

  AllowedI2cAddressList:
    type: array
    items:
      $ref: "https://schemas.electricity.works/formats/non.negative.int"
    description: >
      The I²C bus addresses this expander can be set to in the field, when
      the address is selectable (DIP switches). The chosen address is a
      deployment fact recorded on the component.

  TypeName:
    const: "i2c.expander"

  Version:
    const: "000"

required:
  - ExpanderIdx
  - I2cBus
  - ExpanderType
  - TypeName
  - Version

additionalProperties: false

examples:
  - |
    {
      "ExpanderIdx": 1,
      "I2cBus": "DefaultBus",
      "ExpanderType": "Pcf8575",
      "AllowedI2cAddressList": [32, 33, 34, 35, 36, 37, 38, 39],
      "TypeName": "i2c.expander",
      "Version": "000"
    }

x-gridworks:
  owner: "gridworks-energy"
  axioms:
    - number: 1
      name: "AddressSpecification"
      statement: >
        Exactly one of I2cAddress and AllowedI2cAddressList SHALL be present.
