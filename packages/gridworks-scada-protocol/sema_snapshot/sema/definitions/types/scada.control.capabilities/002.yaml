$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://schemas.electricity.works/types/scada.control.capabilities/002"

title: "scada.control.capabilities"
type: object
description: >
  Projection of the control surface exposed by a SCADA node: the relay,
  0-10V and interior command nodes an operator may address, the telemetry
  channels that carry the relay and 0-10V nodes' observed state, and the
  command interface of every node that takes event commands.

  This is the cover of the live command tree, not the tree: each entry
  binds a command vocabulary to the node that executes it. A relay owned
  by an interior command node (the vdc relay under five-v-boss, hp-boss's
  ops relay) is listed for its state but is commanded through its owner. It
  is a control-focused projection and does not represent the full system
  topology.

properties:

  FromGNodeAlias:
    $ref: "https://schemas.electricity.works/formats/left.right.dot"
    description: >
      GNode alias of the SCADA actor publishing this capability projection.

  MessageCreatedMs:
    $ref: "https://schemas.electricity.works/formats/utc.milliseconds"
    description: >
      Timestamp at which this projection was created.

  RelayNodes:
    type: array
    description: >
      List of Spaceheat nodes representing controllable relays exposed by
      this SCADA. Each node is dispatch-addressable by Name.
    items:
      $ref: "https://schemas.electricity.works/types/spaceheat.node.gt/303"

  DacNodes:
    type: array
    description: >
      List of Spaceheat nodes representing controllable 0-10V outputs exposed
      by this SCADA. Each node is dispatch-addressable by Name.
    items:
      $ref: "https://schemas.electricity.works/types/spaceheat.node.gt/303"

  CommandNodes:
    type: array
    description: >
      Interior nodes that take event commands and command actuators of
      their own, such as hp-boss and five-v-boss. A node with two command
      vocabularies (five-v-boss: turn.5v.on.off and reboot.picos) has one
      interface entry per vocabulary. Each node is
      dispatch-addressable by Name; its state reaches the operator through
      single.machine.state rather than a control channel.
    items:
      $ref: "https://schemas.electricity.works/types/spaceheat.node.gt/303"

  ControlChannels:
    type: array
    description: >
      Data channels corresponding to controllable nodes. Each channel's
      AboutNodeName identifies the RelayNodes or DacNodes entry whose observed
      state is represented by the channel.
    items:
      $ref: "https://schemas.electricity.works/types/data.channel.gt/003"

  CommandInterfaces:
    type: array
    description: >
      The command interface of every node the current tree root commands
      directly: the event vocabulary, the state vocabulary and the
      transitions a command asks for.
    items:
      $ref: "https://schemas.electricity.works/types/gw.command.interface/000"

  TypeName:
    const: "scada.control.capabilities"

  Version:
    const: "002"

required:
  - FromGNodeAlias
  - MessageCreatedMs
  - RelayNodes
  - DacNodes
  - CommandNodes
  - ControlChannels
  - CommandInterfaces
  - TypeName
  - Version

additionalProperties: false

