x-gridworks:
  owner: "gridworks-energy"

  axioms:
    - number: 1
      name: "ActorClassConsistency"
      statement: >
        a. All nodes in RelayNodes SHALL have ActorClass equal to Relay.
        b. All nodes in DacNodes SHALL have ActorClass equal to ZeroTenOutputer.
        c. No node in CommandNodes SHALL have ActorClass equal to Relay or
        ZeroTenOutputer.

    - number: 2
      name: "HandleTerminalMatchesName"
      statement: >
        For every node in RelayNodes, DacNodes and CommandNodes, Handle SHALL
        be present and its final dot-separated token SHALL equal Name.

    - number: 3
      name: "AboutNodesAreControlNodes"
      statement: >
        The set of ControlChannels.AboutNodeName values SHALL equal the set of
        RelayNodes.Name and DacNodes.Name values.

    - number: 4
      name: "CommandInterfacesCoverTheTree"
      statement: >
        a. The set of CommandInterfaces.ActorName values SHALL equal the set of
        Name values of the nodes in RelayNodes and CommandNodes whose Handle
        does not extend the Handle of any CommandNodes entry (a Handle extends
        another when it equals that Handle followed by a dot and further
        tokens).
        b. No two CommandInterfaces entries SHALL share both an ActorName and an
        EventType; a node with more than one command vocabulary carries one
        entry per vocabulary.

  extended_description: >
    Axiom 4 is what makes the message the cover of the tree. A node that
    sits under no interior command node is commanded by the tree's
    authority directly and gets an interface; a relay under an interior
    node belongs to it and is commanded through that node's interface.
    The rule reads the same whichever authority holds the tree, since
    Handles carry the live tree. DacNodes take an analog value rather
    than an event and so carry no interface.
