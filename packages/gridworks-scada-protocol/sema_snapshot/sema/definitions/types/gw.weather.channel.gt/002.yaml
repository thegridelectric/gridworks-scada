$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://schemas.electricity.works/types/gw.weather.channel.gt/002"

title: "gw.weather.channel.gt"
type: object
description: >
  An observed weather series: one quantity measured by one station,
  the ground-truth series forecasters are scored against. The station
  is identity — a different instrument at the same place is a different
  channel — while the path readings arrive by (live API, archive
  backfill) is provenance recorded per reading, so the record names no
  source or method. Coupled bijectively with a table in the
  gridworks-weather DB. Changing a structural fact is a new record (new
  Id); the Name persists, and Start scopes which record an archived
  message resolves against.

properties:
  Name:
    $ref: "https://schemas.electricity.works/formats/left.right.dot"
    description: >
      The channel's fleet-scoped name, derived from StationAlias and
      Quantity (Axiom 1).

  DisplayName:
    $ref: "https://schemas.electricity.works/formats/non.empty.string"
    description: >
      Human-facing name for display tooling.

  Quantity:
    $ref: "https://schemas.electricity.works/enums/gw1.quantity/003"
    description: >
      The physical quantity this series observes.

  Unit:
    $ref: "https://schemas.electricity.works/enums/gw1.unit/003"
    description: >
      The scaled-integer unit of every reading on this channel.

  StationAlias:
    $ref: "https://schemas.electricity.works/formats/lowercase.token"
    description: >
      Alias of the gw.weather.station.gt whose readings this series is.

  EmitPeriodS:
    $ref: "https://schemas.electricity.works/formats/positive.int"
    description: >
      Seconds between scheduled observation emissions. The schedule is
      the contract that lets a consumer distinguish a drop from
      silence.

  EmitOffsetS:
    $ref: "https://schemas.electricity.works/formats/non.negative.int"
    description: >
      Offset into the emission period of each scheduled emission
      (0 with EmitPeriodS 3600 is top-of-hour).

  Start:
    $ref: "https://schemas.electricity.works/formats/utc.iso8601.seconds"
    description: >
      When this record became the active record for Name; an archived
      message resolves against the record active at its time.

  Id:
    $ref: "https://schemas.electricity.works/formats/uuid4.str"
    description: >
      Immutable identifier of this record. A structural change is a
      new record with a new Id under the persisting Name.

  TypeName:
    const: "gw.weather.channel.gt"

  Version:
    const: "002"

required:
  - Name
  - DisplayName
  - Quantity
  - Unit
  - StationAlias
  - EmitPeriodS
  - EmitOffsetS
  - Start
  - Id
  - TypeName
  - Version

additionalProperties: false

examples:
  - |
    {
      "Name": "kmlt.temperature",
      "DisplayName": "Millinocket outdoor temperature",
      "Quantity": "Temperature",
      "Unit": "FahrenheitX10",
      "StationAlias": "kmlt",
      "EmitPeriodS": 3600,
      "EmitOffsetS": 0,
      "Start": "2026-10-18T00:00:00Z",
      "Id": "2e7c9a1f-6b4d-4f8e-b3a9-5c1e8d7f2a4c",
      "TypeName": "gw.weather.channel.gt",
      "Version": "002"
    }

x-gridworks:
  owner: "gridworks-energy"

  axioms:
    - number: 1
      name: "NameDerivation"
      statement: >
        Name SHALL equal StationAlias + "." + the lowercased Quantity
        value, optionally followed by "." and one or more further
        segments (a variant suffix for a semantically different series
        from the same station, never acquisition detail).
    - number: 2
      name: "EmitOffsetBound"
      statement: >
        EmitOffsetS SHALL be strictly less than EmitPeriodS.
