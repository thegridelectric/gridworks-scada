  gw.hydronic:
    latest_version: "000"
    owner: gridworks-energy
    versioning_strategy: "literal"
    description: "Hydronic / flow-topology config: zones, zone-call circuits, water store, backup heat, primary-flow source, primary-pump owner, refrigerant cycle."

    versions:
      "000":
        schema_url: "https://schemas.electricity.works/types/gw.hydronic/000"
        created: "2026-10-06T18:10:00Z"
        status: "staging"
        summary: "- Typed hydronic block promoted out of gw.house0.layout's freeform Hydronic: Zones (gw1.hvac.zone list), ZoneCallCircuits (gw1.zone.call.circuit list, required), PrimaryFlowSource (gw.primary.flow.source), Strategy. Axioms: Cardinality, CircuitResolution. The Siegenthaler-loop flags left this word: plumbed-ness is what a has-sieg layout word means, and use is operational (gw.house0.family.params SiegLoopStrategy). - HpCommandNodeName (optional spaceheat.name): the node that takes heat-pump commands under hp-boss; absent = nothing commands the heat pump. The layout words' CommandableHeatPump axiom governs it. - Strategy dropped: the control family is the layout word's own TypeName (invariant per word, so not a data field; the same rule that retired SiegLoopPlumbed). - WaterStore (optional gw.water.store): the water store tanks; absent for a layout whose store is not water tanks. Cardinality bounds the zones. - PrimaryPumpOwner (gw.primary.pump.owner, required): who runs the primary pump, the heat pump or the scada; the layout words' PrimaryPumpActuators axiom ties the actuator nodes to it. RefrigerantCycle (gw.refrigerant.cycle, required): single compressor or two-compressor cascade, for the optimizer's COP model. - Backup (optional, one of gw.boiler.backup or gw.element.backup): the backup heat; absent for a layout with no backup. - CircuitResolution b: a circuit's CircuitPosition is its 1-based place in ZoneCallCircuits. PrimaryCircuit axiom: each zone's PrimaryCircuitPosition names a circuit serving that zone, and that circuit carries a setpoint channel. CircuitDistinctness axiom: no two circuits share a Name, a whitewire channel, a setpoint channel, a temperature channel or a relay node. CircuitResolution d is dropped: PrimaryCircuit implies every zone is served."
        direct_dependencies:
          structural:
            - "gw.boiler.backup:000"
            - "gw.element.backup:000"
            - "gw.primary.flow.source:000"
            - "gw.primary.pump.owner:000"
            - "gw.refrigerant.cycle:000"
            - "gw.water.store:000"
            - "gw1.hvac.zone:000"
            - "gw1.zone.call.circuit:000"
            - "spaceheat.name"

