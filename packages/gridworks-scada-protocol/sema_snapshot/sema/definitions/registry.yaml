  non.negative.int:
    owner: gridworks-energy
    schema_url: "https://schemas.electricity.works/formats/non.negative.int"
    created: "2024-09-02T15:00:00Z"
    status: "published"
    description: "Non-negative integer with non-coercive serialized validation"

  pascal.case:
    owner: gridworks-energy
    schema_url: "https://schemas.electricity.works/formats/pascal.case"
    created: "2026-05-05T11:40:39Z"
    status: "published"
    description: "PascalCase identifier composed of ASCII alphanumeric characters"

  positive.float:
    owner: gridworks-energy
    schema_url: "https://schemas.electricity.works/formats/positive.float"
    created: "2026-03-30T16:00:00Z"
    status: "published"
    description: "Floating-point number strictly greater than zero"

  positive.int:
    owner: gridworks-energy
    schema_url: "https://schemas.electricity.works/formats/positive.int"
    created: "2024-09-02T15:00:00Z"
    status: "published"
    description: "Positive integer with non-coercive serialized validation"

