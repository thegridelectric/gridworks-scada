  gw.operational.params:
    latest_version: "000"
    owner: gridworks-energy
    versioning_strategy: "literal"
    description: "Operational/optimization parameters for one home: the fields every layout family tunes, plus a FamilyParams block (oneOf the <family>.family.params words) for the knobs that presume a layout feature."

    versions:
      "000":
        schema_url: "https://schemas.electricity.works/types/gw.operational.params/000"
        created: "2026-10-13T12:00:00Z"
        status: "staging"
        summary: "Initial version. ScadaAlias (the applying Scada's identity — stored/emitted instances self-identify; the layout holds the full GNodes) + FamilyParams (oneOf gw.house0.family.params / gw.nolan.family.params, discriminated by TypeName; the family TypeName pairs the instance with its layout family, so a mismatched pair fails at decode) + CaptureTuningList + ZeroTenPowerOnList + Standby x StandbyPosture x EnergizedStandbyRelays (the standby machine energizes the listed relays and nothing else; the posture names what the list achieves) + ServiceMode + DispatchHold (gw.dispatch.hold: the operator's hold and the cold latch; one of three authorities over dispatch) + CopCurve + HeatingCurve + HpTurnOnMinutes + HpMaxKwEl + LoadOverestimationPercent + UsesBackupWhenCold + HorizonHours + WeatherBundleName (the gw.weather.forecast.bundle.gt the LTN relays and the scada pulls) + Tariff (gw.tou.tariff). All required — no assumed defaults. Axioms 1-2: ChannelName unique across CaptureTuningList, NodeName unique across ZeroTenPowerOnList. Axiom 3: Standby implies DispatchHold.OperatorHold. Axiom 4: the posture fixes the relay list (MonitorOnly empty; House0 NoHeatingOrCooling = hp-failsafe-relay + aquastat-ctrl-relay; Nolan NoHeatingOrCooling empty). Axiom 5: Standby holds a House0 loop at full send (SiegLoopStrategy HoldFullSend)."
        direct_dependencies:
          structural:
            - "capture.tuning:000"
            - "cop.curve:000"
            - "gw.dispatch.hold:000"
            - "gw.house0.family.params:000"
            - "gw.nolan.family.params:000"
            - "gw.standby.posture:000"
            - "gw.tou.tariff:000"
            - "gw1.service.mode:000"
            - "heating.curve:000"
            - "left.right.dot"
            - "non.negative.int"
            - "positive.float"
            - "positive.int"
