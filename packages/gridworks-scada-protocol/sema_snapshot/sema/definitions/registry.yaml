  maintainer: "gridworks-energy"

formats:
  decimal.digit:
    owner: gridworks-energy
    schema_url: "https://schemas.electricity.works/formats/decimal.digit"
    created: "2025-03-03T20:40:00Z"
    status: "published"
    description: "Single decimal digit (integer 0 through 9) with non-coercive serialized validation"

  git.commit:
    owner: gridworks-energy
    schema_url: "https://schemas.electricity.works/formats/git.commit"
    created: "2026-10-08T21:00:00Z"
    status: "published"
    description: "A git commit identifying running code: a 40-character lowercase git hash, suffixed -dirty when the working tree had uncommitted changes"

  handle.name:
    owner: gridworks-energy
    schema_url: "https://schemas.electricity.works/formats/handle.name"
    created: "2024-09-02T15:00:00Z"
    status: "published"
    description: "Dot-separated hierarchical identifier with hyphen-friendly lowercase segments"

  hh.mm:
    owner: gridworks-energy
    schema_url: "https://schemas.electricity.works/formats/hh.mm"
    created: "2026-08-12T22:15:00Z"
    status: "published"
    description: "Wall-clock time of day at minute resolution, 24-hour zero-padded HH:MM (00:00 through 23:59); timezone-free"

  iana.timezone.str:
    owner: gridworks-energy
    schema_url: "https://schemas.electricity.works/formats/iana.timezone.str"
    created: "2026-09-17T20:10:00Z"
    status: "published"
    description: "Shape of an IANA tz-database identifier: one to three slash-separated segments of letters, digits, underscore, plus, or minus (e.g. America/New_York, Etc/GMT+5, UTC); validates shape only, not membership in the current tz database"

  left.right.dot:
    owner: gridworks-energy
    schema_url: "https://schemas.electricity.works/formats/left.right.dot"
    created: "2022-01-01T00:00:00Z"
    status: "published"
    description: "Dot-separated hierarchical identifier composed of lowercase alphanumeric segments"

  lowercase.token:
    owner: gridworks-energy
    schema_url: "https://schemas.electricity.works/formats/lowercase.token"
    created: "2026-10-18T15:30:00Z"
    status: "published"
    description: "One lowercase alphanumeric segment starting with a letter; exactly one segment of a dotted identifier, no separators"

  mac.address:
    owner: gridworks-energy
    schema_url: "https://schemas.electricity.works/formats/mac.address"
    created: "2026-06-15T02:10:00Z"
    status: "published"
    description: "MAC address as six lowercase hexadecimal octet pairs, colon-separated (e.g. 34:e1:d1:82:22:22)."

