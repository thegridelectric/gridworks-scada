# sema_seed_request.yaml
#
# Seed request for the scada's Sema snapshot: every word the scada speaks,
# vendored so the hand-written gwsproto twins are tested against the sema
# authority's own generated classes. The snapshot is a test oracle, not
# shipped code; it is committed and regenerated with:
#
#   scripts/regen_sema_snapshot.sh
#
# EVERY type and every versioned enum is pinned to ONE version: the version
# the scada speaks. A scada (the proactor) speaks exactly one version of
# each word, so the snapshot must hold exactly one; `{}` (registry latest)
# is never used, because the dependency closure can then bring in a second
# version of a word behind the pinned one, and the twins would be checked
# against a snapshot the scada cannot be. A closure that still reaches a
# second version is a sema-side inconsistency (a dependent bound to an old
# version); the conformance check reports it as multi-version, and the fix
# is in sema, not here. Versionless enums take `{}` (nothing to pin).
# A twin with no sema word is on the conformance test's NO_WORD allowlist;
# a snapshot word with no twin fails that test.

# Local class names mirror gwsproto's conventions: strip a leading
# gw1./gw2./gw. segment, plus per-word overrides where gwsproto diverges.
local_names:
  strip_prefixes: [gw1, gw2, gw]
  overrides:
    spaceheat.telemetry.name: telemetry.name

