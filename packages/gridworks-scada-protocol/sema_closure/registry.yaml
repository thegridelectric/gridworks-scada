types:
  ads.channel.config:
    latest_version: "000"
    owner: gridworks-energy
    versioning_strategy: "literal"
    description: "Per-channel configuration for one thermistor read through an ADS111x ADC terminal block (the TSnap path)."

    versions:
      "000":
        schema_url: "https://schemas.electricity.works/types/ads.channel.config/000"
        created: "2026-06-14T12:00:00Z"
        status: "staging"
        summary: "Initial Sema version (flattened from the scada AdsChannelConfig runtime; ThermistorMakeModel -> ThermistorDeviceType). Carries only the per-channel hardware binding; capture/report tuning lives in operational-params (capture.tuning), not the static layout — no Unit/Exponent (redundant; carried by channel identity) or PollPeriodMs/CapturePeriodS/AsyncCapture/AsyncCaptureDelta."
        direct_dependencies:
          structural:
            - "pascal.case"
            - "positive.int"
            - "spaceheat.name"
            - "thermistor.data.method:000"

  ads111x.based.component.gt:
    latest_version: "000"
    owner: gridworks-energy
    versioning_strategy: "literal"
    description: "An ADS111x-based multipurpose-sensor component instance: thermistor inputs read through ADS111x ADC terminal blocks (the TSnap path)."

    versions:
      "000":
        schema_url: "https://schemas.electricity.works/types/ads111x.based.component.gt/000"
        created: "2026-06-26T03:40:00Z"
