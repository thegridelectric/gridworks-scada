        summary: "Initial Sema version (flattened from the scada Ads111xBasedComponentGt runtime)."
        direct_dependencies:
          structural:
            - "ads.channel.config:000"
            - "pascal.case"
            - "uuid4.str"

  ads111x.based.device.type.gt:
    latest_version: "000"
    owner: gridworks-energy
    versioning_strategy: "literal"
    description: "Specialized device-type record for an ADS111x-based analog temperature sensor category (used by beech/oak/maple/fir/elm); keyed by DeviceType."

    versions:
      "000":
        schema_url: "https://schemas.electricity.works/types/ads111x.based.device.type.gt/000"
        created: "2026-06-13T22:10:00Z"
        status: "staging"
        summary: "Initial draft (specialized device-type record; per-family successor to the field ads111x.based.cac.gt, keyed by DeviceType)."
        direct_dependencies:
          structural:
            - "pascal.case"
            - "positive.int"
            - "spaceheat.telemetry.name:007"

  capture.tuning:
    latest_version: "000"
    owner: gridworks-energy
    versioning_strategy: "literal"
    description: "Per-channel telemetry capture/report tuning (operational-params), authored apart from the static hardware layout."

    versions:
      "000":
        schema_url: "https://schemas.electricity.works/types/capture.tuning/000"
        created: "2026-06-29T19:40:00Z"
        status: "staging"
        summary: "Initial Sema version — the per-channel capture params (CapturePeriodS, AsyncCapture, AsyncCaptureDelta, PollPeriodMs) extracted from the channel-config family into operational-params."
        direct_dependencies:
          structural:
            - "positive.int"
            - "spaceheat.name"

  cop.curve:
    latest_version: "000"
    owner: gridworks-energy
    versioning_strategy: "literal"
    description: "A heat pump's coefficient-of-performance model: COP = Intercept + OatCoeff * OatF + LwtCoeff * LwtF, floored at Min below MinOatF."

    versions:
      "000":
        schema_url: "https://schemas.electricity.works/types/cop.curve/000"
        created: "2026-07-09T21:30:00Z"
        status: "staging"
        summary: "Initial version (Intercept, OatCoeff, LwtCoeff, Min, MinOatF) — the COP model migrated out of scada deployment config into operational params."
        direct_dependencies:
          structural: []

  dac.output.config:
    latest_version: "000"
    owner: gridworks-energy
    versioning_strategy: "literal"
    description: "Control config for one 0-10V output: reporting channel, commanding actor, DAC channel, and EEPROM power-on defaults — the relay.control.config analog for an analog actuator."

    versions:
      "000":
        schema_url: "https://schemas.electricity.works/types/dac.output.config/000"
        created: "2026-09-02T21:15:00Z"
        status: "staging"
        summary: "Initial version (ChannelName, ActorName, DacChannel, PowerOnRawValue, PowerOnVref, PowerOnGain; EepromRanges axiom)."
        direct_dependencies:
          structural:
            - "i2c.dac.channel:000"
            - "i2c.dac.vref:000"
            - "non.negative.int"
            - "positive.int"
            - "spaceheat.name"

  data.channel.gt:
    latest_version: "003"
    owner: gridworks-energy
    versioning_strategy: "literal"
    description: "Canonical definition of a telemetry channel representing directly captured measurements"

    versions:
      "003":
        schema_url: "https://schemas.electricity.works/types/data.channel.gt/003"
        created: "2026-06-26T03:40:00Z"
        status: "published"
        summary: "- InPowerMetering: drop (metering is declared by the consuming transactive channel, not here) - PowerMeteringConstraint axiom: drop"
        direct_dependencies:
          structural:
            - "gw1.quantity:000"
            - "left.right.dot"
            - "spaceheat.name"
            - "spaceheat.telemetry.name:007"
            - "utc.seconds"
            - "uuid4.str"
          axiom:
            - "spaceheat.telemetry.quantity.projection:000"

